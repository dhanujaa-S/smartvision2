<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>SmartVision</title>
<style>
  :root{
    --bg:#000; --card:#111a27; --fg:#fff; --muted:#a6b4c6; --yellow:#FFE600; --cyan:#00E5FF;
    --blue:#1469e8; --green:#0e5a3c; --green-line:#2ee59d; --red:#D90429; --amber:#FF9F1C; --line:#243349;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);
    font:16px/1.35 'Atkinson Hyperlegible',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
  button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  [hidden]{display:none !important}
  svg{display:block;flex:none}

  /* ---- views ---- */
  .view{display:none;padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
  .view.active{display:block}
  /* the camera keeps running when its view is not on screen */
  #view-camera:not(.active){display:block;position:fixed;left:0;top:0;width:4px;height:4px;opacity:0;overflow:hidden;pointer-events:none;z-index:-1}
  #view-camera.active{padding:0;max-width:none;position:fixed;inset:0;background:#000}
  #camStage{position:relative;width:100%;height:100%}
  #video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 0;position:relative;z-index:25}
  .back{position:relative;z-index:25;min-height:56px;padding:0 20px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:1.1rem}
  #view-camera .topbar{position:absolute;left:12px;top:0;z-index:25}

  /* ---- header ---- */
  header.top{display:flex;align-items:center;gap:12px;padding:10px 2px 6px}
  header.top img{width:46px;height:46px;border-radius:12px}
  header.top h1{margin:0;font-size:1.5rem;line-height:1;letter-spacing:.01em}
  header.top h1 b{color:var(--cyan)}
  header.top small{display:block;color:var(--muted);font-size:.8rem;margin-top:3px}
  #chip{display:inline-flex;align-items:center;gap:8px;margin-left:auto;max-width:46%;padding:8px 14px;border-radius:22px;
    border:2px solid var(--green-line);font-weight:700;font-size:.8rem;line-height:1.25;background:#05140d}
  #chip i{width:11px;height:11px;border-radius:50%;background:var(--green-line);flex:none}
  #chip.off{border-color:var(--red)} #chip.off i{background:var(--red)}
  #modeChip{display:block;width:100%;margin:4px 0 0;position:relative;z-index:25;min-height:44px;padding:6px 16px;border-radius:14px;
    background:#0b2a1c;border:2px solid var(--green-line);font-weight:800;font-size:.85rem;line-height:1.15;text-align:center}
  #modeChip.off{background:#2a2a14;border-color:var(--yellow)}

  /* ---- tiles ---- */
  .tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:20px;padding:14px 16px;
    border:2px solid var(--line);background:var(--card);min-height:84px}
  #hazTile{margin-top:4px;background:#06202c;border-color:var(--cyan)}
  #hazTile.warn{background:var(--amber);border-color:#ffd08a;color:#000}
  #hazTile.stop{background:var(--red);border-color:#ff8da0;color:#fff}
  #hazTile h2{margin:0;font-size:1.5rem;line-height:1.1}
  #hazTile p{margin:3px 0 0;font-size:1.05rem}
  #hazTile .dist{margin-left:auto;min-width:76px;text-align:center;font-weight:800;font-size:1.5rem;padding:8px;border-radius:14px;background:rgba(0,0,0,.28)}
  #hazTile.calm .dist{display:none}
  #hazTile.calm{background:#0b5f63;border-color:#37c9cf}
  #hazTile .ic-eye{flex:none;color:#e9ffff}
  #hazTile.calm .ic-warn,#hazTile:not(.calm) .ic-eye{display:none}
  #hazSub{white-space:pre-line}
  #voiceLabel{display:block;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.35)}
  #voiceBtn{margin-top:10px;background:var(--blue);border-color:#5b9bff;min-height:132px;align-items:center}
  #voiceBtn[data-state="listening"]{background:var(--yellow);color:#000;border-color:#fff3a0}
  #voiceBtn .t{display:block;font-size:1.55rem;font-weight:800;line-height:1.1}
  #voiceBtn .l{display:block;margin-top:6px;font-size:.98rem;line-height:1.3;opacity:.95}
  #voiceBtn .l b{opacity:.75;font-weight:700}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .three .tile{flex-direction:column;justify-content:center;text-align:center;gap:6px;min-height:92px;padding:10px 6px;font-weight:800}
  .three small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
  #backTile{background:#1a1245;border-color:#6b55d6}
  #radar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
  .zone{background:var(--green);border:2px solid var(--green-line);border-radius:14px;padding:8px 2px;text-align:center;min-width:0}
  .zone .ar{display:block;margin:0 auto 2px;color:#7dffcb}
  .zone.yellow .ar,.zone.red .ar{color:inherit}
  .zone .zn{font-size:.74rem;font-weight:800}
  .zone .zv{margin-top:3px;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .zone.seen{background:#06324a;border-color:var(--cyan)}
  .zone.yellow{background:var(--yellow);border-color:#fff3a0;color:#000}
  .zone.red{background:var(--red);border-color:#ff8da0;color:#fff}
  #navCard,.navcard{margin-top:10px;border-radius:20px;border:2px solid var(--yellow);background:#14120a;padding:14px 16px}
  .navcard h3{margin:0;font-size:1.25rem;color:var(--yellow)}
  .navcard p{margin:4px 0 0}
  .navcard .bar{height:12px;border-radius:8px;background:#2b2a1c;margin:10px 0;overflow:hidden}
  .navcard .bar i{display:block;height:100%;width:0;background:var(--yellow)}
  .stopNav{width:100%;min-height:64px;border-radius:16px;background:var(--red);color:#fff;font-weight:800;font-size:1.2rem}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .two .tile{flex-direction:column;justify-content:center;text-align:center;min-height:128px;font-size:1.3rem;font-weight:800;gap:8px}
  .two small{display:block;margin-top:2px;font-weight:400;color:#d6e4ff;font-size:.9rem}
  #mapTile{background:var(--green);border-color:var(--green-line)}
  #camTile{background:#0b3a86;border-color:#5b9bff}
  #moreBtn{margin-top:10px;min-height:68px;justify-content:center;font-weight:800;font-size:1.1rem}
  #navStatus{margin-top:8px;min-height:1.3em;color:var(--muted);font-size:.92rem}

  /* ---- map / more ---- */
  #map{height:calc(100vh - 340px);min-height:260px;border-radius:18px;border:2px solid var(--green-line);background:#0b1220}
  #mapMsg{color:var(--muted);margin:6px 0}
  .speakBtn.wide{margin-top:10px;min-height:76px;border-radius:20px;background:var(--blue);font-weight:800;font-size:1.3rem;width:100%}
  .speakBtn[data-state="listening"]{background:var(--yellow);color:#000}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .opt{min-height:60px;padding:0 18px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:700}
  .opt[aria-pressed="false"]{color:var(--muted)}
  input{flex:1;min-width:0;min-height:56px;border-radius:14px;border:2px solid var(--line);background:#05080d;color:var(--fg);padding:0 14px;font:inherit}
  #fps,#dbg{color:var(--muted);font-size:.85rem}

  /* ---- overlays ---- */
  #hazBar{position:fixed;left:10px;right:10px;top:10px;z-index:35;padding:12px 16px;border-radius:16px;background:var(--red);color:#fff;
    font-weight:800;font-size:1.3rem;border:2px solid #ff8da0;}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:30;box-shadow:inset 0 0 0 0 var(--red);transition:box-shadow .15s}
  #flash.on{box-shadow:inset 0 0 0 10px var(--red)}
  #gesture{position:fixed;inset:0;z-index:20;background:transparent;width:100%;height:100%}
  #splash{position:fixed;inset:0;z-index:50;background:#000;color:var(--yellow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:2rem;font-weight:800;text-align:center;padding:24px}
  #splash small{color:var(--cyan);font-size:1.05rem;font-weight:700}
  #splash em{font-style:normal;color:var(--muted);font-size:.95rem;font-weight:400;max-width:30ch}
  #splash img{border-radius:22px}
</style>
</head>
<body>
<button id="splash" type="button" aria-label="Tap anywhere to start SmartVision">
  <img src="icon-192.png" width="96" height="96" alt="">
  <span>Tap anywhere to start</span>
  <small>SmartVision</small>
  <em>Hands-free mode: tap anywhere to speak. A helper can tap the green chip at the top right to use the buttons.</em>
</button>
<div id="flash" aria-hidden="true"></div>
<div id="hazBar" role="alert" aria-live="assertive" hidden></div>
<button id="gesture" type="button" aria-label="Tap to speak. Press and hold to repeat. Double tap to stop."></button>

<section id="view-main" class="view active" aria-label="SmartVision">
  <button id="modeChip" type="button" aria-label="Hands-free mode is on. Tap to switch to button mode for a helper">Hands-free ON</button>
  <header class="top">
    <img src="icon-192.png" alt="">
    <div><h1>Smart<b>Vision</b></h1><small>Your AI vision assistant</small></div>
    <div id="chip" class="off" aria-live="polite"><i></i><span><span id="chipText">Camera off</span><br><span id="chipText2"></span></span></div>
  </header>

  <div id="hazTile" class="tile calm" role="status" aria-live="polite">
    <svg class="ic-warn" width="52" height="52" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 1 21h22L12 2zm1 15h-2v-2h2v2zm0-4h-2V9h2v4z"/></svg>
    <svg class="ic-eye" width="64" height="64" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 6C6.5 6 2.7 9.6 1 12c1.7 2.4 5.5 6 11 6s9.3-3.600 11-6c-1.700-2.400-5.500-6-11-6zm0 9.500A3.500 3.500 0 1 1 12 8.500a3.500 3.500 0 0 1 0 7z"/><circle cx="12" cy="12" r="1.800"/><path d="M12 1.500v2.500M5 3.500l1.500 2M19 3.500l-1.500 2" stroke="currentColor" stroke-width="1.500" stroke-linecap="round" fill="none"/></svg>
    <div><h2 id="hazTitle">Scanning the path</h2><p id="hazSub">Obstacle detection is ON</p></div>
    <div class="dist" id="hazDist"></div>
  </div>

  <button id="voiceBtn" class="tile" type="button" aria-label="Tap and speak a place or a command">
    <svg width="84" height="84" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="#fff" stroke-width="2.500"/><g fill="#fff" transform="translate(24 24) scale(.8) translate(-24 -24)"><path d="M24 29a5 5 0 0 0 5-5V15a5 5 0 0 0-10 0v9a5 5 0 0 0 5 5z"/><path d="M33 23h-2.200a6.800 6.800 0 0 1-13.600 0H15a9 9 0 0 0 8 8.900V36h2v-4.100A9 9 0 0 0 33 23z"/></g></svg>
    <span style="min-width:0">
      <span class="t" id="voiceLabel">Tap to speak</span>
      <span class="l"><b>You said:</b> <span id="heard">—</span></span>
      <span class="l"><b>App said:</b> <span id="say">Starting…</span></span>
    </span>
  </button>

  <div class="three">
    <button id="calBtn" class="tile" type="button" aria-label="Calibrate distance. Stand a person two metres away.">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8.9 3A9 9 0 0 0 13 3.1V1h-2v2.1A9 9 0 0 0 3.1 11H1v2h2.1A9 9 0 0 0 11 20.9V23h2v-2.1a9 9 0 0 0 7.9-7.9H23v-2h-2.1zM12 19a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
      <span>Calibrate<small>(2 m)</small></span></button>
    <button id="repeatBtn" class="tile" type="button" aria-label="Repeat the last message">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7a6 6 0 0 1 0 12 6 6 0 0 1-6-6H4a8 8 0 0 0 8 8 8 8 0 0 0 0-16z"/></svg>
      <span>Repeat<small>Last message</small></span></button>
    <div id="backTile" class="tile" role="status" aria-label="Back awareness is not active yet">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      <span>Back<small>Not active yet</small></span></div>
  </div>

  <div id="radar" aria-hidden="true">
    <div class="zone" id="zFL"><div class="zn"><svg class="ar" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(-45deg)"><path d="M12 3l8 9h-5v9H9v-9H4z"/></svg>Far Left</div><div class="zv">—</div></div>
    <div class="zone" id="zL"><div class="zn"><svg class="ar" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(-90deg)"><path d="M12 3l8 9h-5v9H9v-9H4z"/></svg>Left</div><div class="zv">—</div></div>
    <div class="zone" id="zA"><div class="zn"><svg class="ar" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(0deg)"><path d="M12 3l8 9h-5v9H9v-9H4z"/></svg>Ahead</div><div class="zv">—</div></div>
    <div class="zone" id="zR"><div class="zn"><svg class="ar" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(90deg)"><path d="M12 3l8 9h-5v9H9v-9H4z"/></svg>Right</div><div class="zv">—</div></div>
    <div class="zone" id="zFR"><div class="zn"><svg class="ar" width="34" height="34" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(45deg)"><path d="M12 3l8 9h-5v9H9v-9H4z"/></svg>Far Right</div><div class="zv">—</div></div>
  </div>

  <div id="navCard" class="navcard" hidden>
    <h3 class="nv-dest">Destination</h3>
    <p class="nv-left">—</p>
    <p class="nv-next">—</p>
    <div class="bar"><i class="nv-bar"></i></div>
    <button class="stopNav" type="button">Stop navigation</button>
  </div>

  <div class="two">
    <button id="mapTile" class="tile" type="button" aria-label="Open map">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
      <span>Map<small>Open map</small></span></button>
    <button id="camTile" class="tile" type="button" aria-label="Open camera live view">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
      <span>Camera<small>Live view</small></span></button>
  </div>
  <button id="moreBtn" class="tile" type="button">More: settings and options</button>
  <div id="navStatus" aria-live="polite"></div>
</section>

<section id="view-camera" class="view" aria-label="Camera live view">
  <div id="camStage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div class="topbar"><button class="back" id="camBack" type="button">Back</button></div>
  </div>
</section>

<section id="view-map" class="view" aria-label="Map">
  <div class="topbar"><button class="back" id="mapBack" type="button">Back</button><b>Map</b></div>
  <div id="map" aria-hidden="true"></div>
  <div id="mapMsg" aria-live="polite"></div>
  <div id="mapNav" class="navcard" hidden>
    <h3 class="nv-dest">Destination</h3>
    <p class="nv-left">—</p>
    <p class="nv-next">—</p>
    <div class="bar"><i class="nv-bar"></i></div>
    <button class="stopNav" type="button">Stop navigation</button>
  </div>
  <button class="speakBtn wide" type="button">Tap and speak</button>
</section>

<section id="view-more" class="view" aria-label="Settings and options">
  <div class="topbar"><button class="back" id="moreBack" type="button">Back</button><b>More options</b></div>
  <div class="row"><button id="startBtn" class="opt" type="button" style="flex:1">Stop camera</button></div>
  <form id="navForm" class="row">
    <input id="dest" type="text" placeholder="Or type a destination" autocomplete="off" aria-label="Destination">
    <button id="goBtn" class="opt" type="submit">Go</button>
  </form>
  <div class="row">
    <button id="alertBtn" class="opt" type="button" aria-pressed="true">Alerts: On</button>
    <button id="shakeBtn" class="opt" type="button" aria-pressed="true">Shake to speak: On</button>
    <button id="earBtn" class="opt" type="button" aria-pressed="true">Earphone button: On</button>
    <button id="helpBtn" class="opt" type="button">Voice commands</button>
    <button id="csvBtn" class="opt" type="button">Save log (CSV)</button>
  </div>
  <div class="row"><span id="fps"></span><span id="dbg"></span></div>
  <button id="langBtn" type="button" hidden>English</button>
</section>

<script src="tf.min.js"></script>
<script src="coco-ssd.min.js"></script>
<script>
// ==== PURE LOGIC START ====
// Same rules as the Python modules: position_analysis.py, text_generation.py, navigation.py
const TH = { leftMax: 0.35, rightMin: 0.65, near: 0.25, medium: 0.06 };

function analyze(pred, W, H, cam) {
  const [x, y, w, h] = pred.bbox;
  const cx = (x + w / 2) / W;
  const horiz = cx < TH.leftMax ? 'left' : (cx > TH.rightMin ? 'right' : 'center');
  const ratio = (w * h) / (W * H);
  const dist = ratio >= TH.near ? 'near' : (ratio >= TH.medium ? 'medium' : 'far');
  const cy = (y + h / 2) / H;
  const a = { label: pred.class, score: pred.score, horiz, dist, ratio, cx, cy, size: Math.sqrt(ratio),
    bbox: pred.bbox, zone: zone5(cx), hN: h / H, bottomN: (y + h) / H,
    truncated: y <= 0.01 * H || (y + h) >= 0.99 * H };
  if (cam) { const f = fuseDist(a, cam); if (f) { a.m = f.m; a.msrc = f.src; a.mok = f.ok; } }
  return a;
}

const TA_LABELS = {
  person: 'மனிதர்', chair: 'நாற்காலி', couch: 'சோபா', bed: 'படுக்கை',
  'dining table': 'மேசை', tv: 'தொலைக்காட்சி', laptop: 'மடிக்கணினி',
  bottle: 'பாட்டில்', cup: 'கோப்பை', car: 'கார்', bicycle: 'சைக்கிள்',
  motorcycle: 'மோட்டார் சைக்கிள்', bus: 'பேருந்து', truck: 'லாரி',
  dog: 'நாய்', cat: 'பூனை', 'cell phone': 'கைபேசி', book: 'புத்தகம்',
  backpack: 'பை', 'potted plant': 'செடி', toilet: 'கழிப்பறை',
  refrigerator: 'குளிர்சாதனப் பெட்டி', clock: 'கடிகாரம்', bench: 'பெஞ்சு',
  'traffic light': 'போக்குவரத்து விளக்கு', 'stop sign': 'நிறுத்த அடையாளம்'
};

const TEXT = {
  en: {
    pos: { left: 'on your left', center: 'ahead', right: 'on your right' },
    dist: { near: 'very close', medium: 'a few steps away', far: 'far away' },
    sentence: (l, p, d) => `${l} ${p}, ${d}`
  },
  ta: {
    pos: { left: 'இடதுபுறம்', center: 'நேரே', right: 'வலதுபுறம்' },
    dist: { near: 'மிக அருகில்', medium: 'சற்று தொலைவில்', far: 'தொலைவில்' },
    sentence: (l, p, d) => `${l} ${p} ${d} உள்ளது`
  }
};

function sentenceFor(a, lang) {
  const label = lang === 'ta' ? (TA_LABELS[a.label] || a.label) : a.label;
  return TEXT[lang].sentence(label, TEXT[lang].pos[a.horiz], TEXT[lang].dist[a.dist]);
}

// Closest and most central first; announce at most two.
function pickTop(items, n = 2) {
  const rank = { near: 0, medium: 1, far: 2 };
  return items.slice().sort((a, b) =>
    rank[a.dist] - rank[b.dist] || Math.abs(a.cx - 0.5) - Math.abs(b.cx - 0.5)
  ).slice(0, n);
}

function distanceM(a, b) {

}
function updateMe() {
  if (!map || !lastPos) return;
  if (!meMarker) meMarker = L.circleMarker(lastPos, { radius: 9, color: '#fff', weight: 3, fillColor: '#1469e8', fillOpacity: 1 }).addTo(map);
  else meMarker.setLatLng(lastPos);
}
function drawRoute() {
  if (!map) return;
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
  if (routeLine && routeLine.length) {
    routeLayer = L.polyline(routeLine, { color: '#FFE600', weight: 6 }).addTo(map);
    if (destPos) destMarker = L.circleMarker(destPos, { radius: 10, color: '#fff', weight: 3, fillColor: '#ff3b4f', fillOpacity: 1 }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });
  }
}
async function showMap() {
  openView('map');
  $('mapMsg').textContent = '';
  if (!(await loadLeaflet())) { $('mapMsg').textContent = 'The map could not load. Check your internet connection.'; return; }
  if (!map) {
    map = L.map('map').setView(lastPos || [13.0827, 80.2707], 16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 60);
  drawRoute(); updateMe();
  if (!lastPos) getPosition().then(p => { lastPos = p; updateMe(); if (!routeLine) map.setView(p, 17); }).catch(() => {});
}

// ---------- Voice: the app asks, the user speaks, the app confirms ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// Newer Chrome can recognise speech on the phone itself (no internet) once the English pack is installed.
let localSR = false;
try { if (SR && SR.available) SR.available({ langs: ['en-IN'], processLocally: true }).then(s => { localSR = (s === 'available' || s === 'readily'); }).catch(() => {}); } catch (e) { /* optional */ }
function sayWait(text) {            // speak and resolve when finished
  sayEl.textContent = text;
  return new Promise(res => {
    if (!('speechSynthesis' in window)) return res();
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-IN';
    const v = voiceFor(u.lang); if (v) u.voice = v;
    const done = () => { clearTimeout(tm); setTimeout(res, 250); };
    const tm = setTimeout(done, 3000 + text.length * 90);
    u.onend = done; u.onerror = done;
    setTimeout(() => synth.speak(u), 60);
  });
}
function listen(ms = 7000) {        // resolves with the heard text, or null
  return new Promise(res => {
    if (!SR) return res(null);
    const r = new SR();
    r.lang = 'en-IN'; r.interimResults = false; r.maxAlternatives = 1;
    if (localSR) { try { r.processLocally = true; } catch (e) { /* older Chrome */ } }
    let fin = false;
    const finish = t => { if (fin) return; fin = true; clearTimeout(tm); try { r.stop(); } catch (e) { /* ignore */ } res(t); };
    r.onresult = e => finish(e.results[0][0].transcript);
    r.onerror = () => finish(null);
    r.onend = () => finish(null);
    const tm = setTimeout(() => finish(null), ms);
    try { r.start(); } catch (e) { finish(null); }
  });
}
function setListening(on) {
  document.querySelectorAll('#voiceBtn,.speakBtn').forEach(b => { b.dataset.state = on ? 'listening' : ''; });
  $('voiceLabel').textContent = on ? 'Listening…' : (handsFree ? 'Tap anywhere to speak' : 'Tap and speak');
}
async function listenWithBeep(ms) {
  setListening(true); beep(0, 'warn');
  const t = await listen(ms);
  setListening(false);
  return t;
}
let heardTimer = null;
function showHeard(t) {
  $('heard').textContent = t; clearTimeout(heardTimer);
  heardTimer = setTimeout(() => { $('heard').textContent = '—'; }, 8000);
}
async function askYesNo(prompt) {
  for (let i = 0; i < 2; i++) {
    await sayWait(i ? 'Please say yes or no.' : prompt);
    const a = parseYesNo((await listenWithBeep(6000)) || '');
    if (a) return a;
  }
  return null;
}
async function whereAmI() {
  const here = await getPosition();
  const d = await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&lat=${here[0]}&lon=${here[1]}`)).json();
  await sayWait(`You are near ${shortName(d.display_name) || 'an unknown place'}.`);
}
async function runCommand(c) {
  switch (c.cmd) {
    case 'where': return whereAmI();
    case 'repeat': return sayWait(lastText || 'Nothing to repeat yet.');
    case 'calibrate': return calibrate();
    case 'help': return sayWait(HELP);
    case 'map': showMap(); return sayWait('Map opened.');
    case 'showcam': openView('camera'); return sayWait('Camera view.');
    case 'home': openView('main'); return sayWait('Main screen.');
    case 'helper': setHandsFree(false, false); return sayWait('Helper mode. The buttons are active.');
    case 'handsfree': setHandsFree(true, false); return sayWait('Hands-free mode on. Tap anywhere to speak.');
    case 'stopnav': stopNav(); openView('main'); return sayWait('Navigation stopped.');
    case 'stop':
      if (nav) { stopNav(); openView('main'); return sayWait('Navigation stopped.'); }
      if (running) { stop(); return sayWait('Camera stopped.'); }
      return sayWait('Nothing is running.');
    case 'stopcam': if (running) { stop(); return sayWait('Camera stopped.'); } return;
    case 'startcam': return running ? sayWait('The camera is already on.') : start();
  }
}
async function voiceDestination() {
  if (dialog) return;
  dialog = true;
  try {
    if (!SR) { await sayWait('Voice input is not supported in this browser. Please use Chrome.'); return; }
    await sayWait(nav ? 'Navigation is on. Say stop to cancel, or say a new destination.' : 'Where do you want to go? Or say a command.');
    let heard = null;
    for (let i = 0; i < 2 && !heard; i++) {
      heard = await listenWithBeep(7000);
      if (!heard && i === 0) await sayWait('I did not hear you. Please say the place again.');
    }
    if (!heard) { await sayWait('Sorry, I could not hear a destination. Tap to try again.'); return; }
    showHeard(heard);
    const c = parseCommand(heard);
    if (c) { await runCommand(c); return; }
    const place = cleanDestination(heard) || heard;
    await sayWait(`Looking for ${place}.`);
    const here = await getPosition(); lastPos = here;
    const to = await geocode(place, here);
    const steps = await getRoute(here, to);
    const meters = steps.reduce((t, st) => t + st.distance, 0);
    const secs = steps.reduce((t, st) => t + (st.duration || 0), 0) || meters / 1.2;
    const name = shortName(to.name) || place;
    const ans = await askYesNo(`${name}. ${distanceText(meters)}, about ${durationText(secs)} walking. Say yes to start, or no to cancel.`);
    if (ans === 'yes') { stopNav(); await sayWait('Starting navigation.'); beginNav(steps, name, to); }
    else await sayWait(ans === 'no' ? 'Cancelled. Tap to choose another place.' : 'I did not understand. Cancelled.');
  } catch (err) {
    const msg = err && err.code === 1 ? 'Location permission is blocked. Please allow location.'
      : (err && err.message === 'Destination not found' ? 'I could not find that place. Tap and try again.'
      : 'Navigation failed. Please check your internet and try again.');
    navStatus.textContent = msg;
    await sayWait(msg);
  } finally { dialog = false; setListening(false); }
}
$('voiceBtn').addEventListener('click', voiceDestination);
document.querySelectorAll('.speakBtn').forEach(b => b.addEventListener('click', voiceDestination));

// ---------- Log export ----------
$('csvBtn').addEventListener('click', () => {
  const csv = logRows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'smartvision_log.csv';
  document.body.appendChild(a); a.click(); a.remove();
});

// ---------- Go ----------
if ('speechSynthesis' in window) speechSynthesis.getVoices();
setHandsFree(handsFree, false);
setCalm();
if (hasActivation()) $('splash').hidden = true;
start();   // the camera opens by itself when the app opens
</script>
